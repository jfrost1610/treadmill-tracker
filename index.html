<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Incline Routine</title>
<style>
  :root{
    --bg:#12171b;
    --surface:#1b2229;
    --surface-2:#232b33;
    --line:#2c363f;
    --text:#eef1ee;
    --text-dim:#8b98a1;
    --incline:#e2a13d;
    --speed:#4fa3c4;
    --good:#7fb885;
    --danger:#d9695f;
    --radius:14px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    overscroll-behavior:none;
    user-select:none;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  #app{max-width:520px; margin:0 auto; padding:20px 18px 40px; min-height:100vh;}

  h1{
    font-size:19px; font-weight:800; letter-spacing:-0.01em; margin:4px 0 2px;
  }
  .sub{color:var(--text-dim); font-size:13px; margin-bottom:18px;}

  /* ---- Terrain profile ---- */
  .terrain-wrap{
    background:var(--surface); border-radius:var(--radius); padding:14px 14px 10px;
    margin-bottom:16px; border:1px solid var(--line);
  }
  .terrain-label{display:flex; justify-content:space-between; font-size:12px; color:var(--text-dim); margin-bottom:6px;}
  svg#terrain{width:100%; height:64px; display:block;}

  /* ---- Player ---- */
  .player{
    background:var(--surface); border-radius:var(--radius); border:1px solid var(--line);
    padding:22px 20px; margin-bottom:16px; text-align:center;
  }
  .stage-name{font-size:13px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.06em; margin-bottom:10px;}
  .readouts{display:flex; justify-content:center; gap:36px; margin-bottom:16px;}
  .readout .val{font-family:'JetBrains Mono', ui-monospace, Menlo, monospace; font-size:40px; font-weight:700; line-height:1;}
  .readout .unit{font-size:12px; color:var(--text-dim); margin-top:4px;}
  .readout.incline .val{color:var(--incline);}
  .readout.speed .val{color:var(--speed);}
  .clock{font-family:'JetBrains Mono', ui-monospace, Menlo, monospace; font-size:56px; font-weight:800; letter-spacing:-0.01em; margin-bottom:4px;}
  .clock-label{font-size:12px; color:var(--text-dim); margin-bottom:18px;}
  .next-up{font-size:13px; color:var(--text-dim); margin-bottom:18px; min-height:18px;}
  .next-up b{color:var(--text); font-weight:700;}

  .controls{display:flex; gap:10px;}
  button{
    font-family:inherit; border:none; border-radius:11px; padding:14px 0; font-size:15px;
    font-weight:700; cursor:pointer; flex:1;
  }
  .btn-primary{background:var(--good); color:#0e1712;}
  .btn-primary.pause{background:var(--incline); color:#1a1206;}
  .btn-secondary{background:var(--surface-2); color:var(--text); border:1px solid var(--line);}
  .btn-danger{background:transparent; color:var(--danger); border:1px solid rgba(217,105,95,.4);}

  /* ---- Builder ---- */
  .builder{background:var(--surface); border-radius:var(--radius); border:1px solid var(--line); padding:16px;}
  .builder-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;}
  .builder-head h2{font-size:14px; font-weight:800; margin:0; text-transform:uppercase; letter-spacing:.05em; color:var(--text-dim);}
  .total{font-size:12px; color:var(--text-dim);}

  .stage-row{
    display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--line);
  }
  .stage-row:last-child{border-bottom:none;}
  .stage-idx{
    width:22px; height:22px; border-radius:50%; background:var(--surface-2); color:var(--text-dim);
    display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700; flex-shrink:0;
  }
  .stage-info{flex:1; font-size:14px;}
  .stage-info .i{color:var(--incline); font-weight:700;}
  .stage-info .s{color:var(--speed); font-weight:700;}
  .stage-info .d{color:var(--text-dim);}
  .stage-actions{display:flex; gap:6px;}
  .icon-btn{
    background:var(--surface-2); border:1px solid var(--line); color:var(--text-dim); border-radius:8px;
    width:30px; height:30px; font-size:14px; padding:0; flex:none; display:flex; align-items:center; justify-content:center;
  }
  .icon-btn.remove{color:var(--danger);}

  .empty{color:var(--text-dim); font-size:13px; text-align:center; padding:20px 0;}

  .add-form{margin-top:14px; padding-top:14px; border-top:1px dashed var(--line);}
  .field-row{display:flex; gap:10px; margin-bottom:10px;}
  .field{flex:1;}
  .field label{display:block; font-size:11px; color:var(--text-dim); margin-bottom:5px; text-transform:uppercase; letter-spacing:.04em;}
  .field input{
    width:100%; background:var(--surface-2); border:1px solid var(--line); color:var(--text);
    border-radius:9px; padding:10px 10px; font-size:16px; font-family:inherit;
  }
  .field input:focus{outline:none; border-color:var(--speed);}
  .add-btn{width:100%; background:var(--speed); color:#0a1a22; margin-top:2px;}

  .unit-toggle{display:flex; gap:6px; margin-bottom:18px;}
  .unit-toggle button{
    flex:none; padding:6px 12px; font-size:12px; background:var(--surface-2); color:var(--text-dim); border:1px solid var(--line);
  }
  .unit-toggle button.active{background:var(--speed); color:#0a1a22; border-color:var(--speed);}

  .backup-row{display:flex; gap:8px; margin-bottom:16px;}
  .backup-row button{
    font-size:13px; padding:10px 0; background:var(--surface-2); color:var(--text); border:1px solid var(--line); border-radius:10px;
  }
  .backup-note{font-size:11px; color:var(--text-dim); margin:-10px 0 16px; text-align:center;}
  .toast{
    position:fixed; left:50%; bottom:28px; transform:translateX(-50%);
    background:var(--surface-2); border:1px solid var(--line); color:var(--text);
    padding:10px 16px; border-radius:10px; font-size:13px; opacity:0; pointer-events:none;
    transition:opacity .25s ease; z-index:50; max-width:80%; text-align:center;
  }
  .toast.show{opacity:1;}

  .hidden{display:none !important;}
</style>
</head>
<body>
<div id="app">
  <h1>Incline Routine</h1>
  <div class="sub">Build a walk, then cycle through it stage by stage.</div>

  <div class="unit-toggle">
    <button id="unitMph" class="active">mph</button>
    <button id="unitKph">km/h</button>
  </div>

  <div class="backup-row">
    <button id="exportBtn">Export backup</button>
    <button id="importBtn">Import backup</button>
    <input type="file" id="importFile" accept="application/json,.json" class="hidden">
  </div>
  <div class="backup-note">Save a backup after building your routine — iOS can wipe saved data unexpectedly.</div>

  <div class="terrain-wrap">
    <div class="terrain-label"><span>Elevation profile</span><span id="terrainTotal">0 min total</span></div>
    <svg id="terrain" viewBox="0 0 500 64" preserveAspectRatio="none"></svg>
  </div>

  <div class="player">
    <div class="stage-name" id="stageName">Ready</div>
    <div class="readouts">
      <div class="readout incline"><div class="val" id="inclineVal">–</div><div class="unit">% incline</div></div>
      <div class="readout speed"><div class="val" id="speedVal">–</div><div class="unit" id="speedUnit">mph</div></div>
    </div>
    <div class="clock" id="clock">00:00</div>
    <div class="clock-label" id="clockLabel">total routine time</div>
    <div class="next-up" id="nextUp">&nbsp;</div>
    <div class="controls">
      <button class="btn-primary" id="startBtn">Start</button>
      <button class="btn-secondary" id="resetBtn">Reset</button>
    </div>
  </div>

  <div class="builder">
    <div class="builder-head">
      <h2>Stages</h2>
      <div class="total" id="stageCount">0 stages</div>
    </div>
    <div id="stageList"><div class="empty">No stages yet — add your first one below.</div></div>

    <div class="add-form">
      <div class="field-row">
        <div class="field">
          <label>Incline %</label>
          <input type="number" id="fIncline" inputmode="decimal" placeholder="4.0" step="0.5" min="0">
        </div>
        <div class="field">
          <label>Speed</label>
          <input type="number" id="fSpeed" inputmode="decimal" placeholder="3.0" step="0.1" min="0">
        </div>
        <div class="field">
          <label>Minutes</label>
          <input type="number" id="fMinutes" inputmode="decimal" placeholder="5" step="0.5" min="0.5">
        </div>
      </div>
      <button class="add-btn" id="addBtn">Add stage</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  var STORE_KEY = 'incline-routine:v1';
  var state = {
    stages: [],
    unit: 'mph',
    running: false,
    paused: false,
    currentIdx: 0,
    remainingSec: 0,
    totalRemainingSec: 0,
    timer: null
  };

  var el = {
    stageList: document.getElementById('stageList'),
    stageCount: document.getElementById('stageCount'),
    terrain: document.getElementById('terrain'),
    terrainTotal: document.getElementById('terrainTotal'),
    stageName: document.getElementById('stageName'),
    inclineVal: document.getElementById('inclineVal'),
    speedVal: document.getElementById('speedVal'),
    speedUnit: document.getElementById('speedUnit'),
    clock: document.getElementById('clock'),
    clockLabel: document.getElementById('clockLabel'),
    nextUp: document.getElementById('nextUp'),
    startBtn: document.getElementById('startBtn'),
    resetBtn: document.getElementById('resetBtn'),
    fIncline: document.getElementById('fIncline'),
    fSpeed: document.getElementById('fSpeed'),
    fMinutes: document.getElementById('fMinutes'),
    addBtn: document.getElementById('addBtn'),
    unitMph: document.getElementById('unitMph'),
    unitKph: document.getElementById('unitKph'),
    exportBtn: document.getElementById('exportBtn'),
    importBtn: document.getElementById('importBtn'),
    importFile: document.getElementById('importFile'),
    toast: document.getElementById('toast')
  };

  function showToast(msg){
    el.toast.textContent = msg;
    el.toast.classList.add('show');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(function(){ el.toast.classList.remove('show'); }, 2600);
  }

  // ---------- persistence (plain localStorage — works on any host, including GitHub Pages) ----------
  function save(){
    try{
      localStorage.setItem(STORE_KEY, JSON.stringify({stages: state.stages, unit: state.unit}));
    }catch(e){ /* storage unavailable — session-only, no interruption to the user */ }
  }
  function load(){
    try{
      var raw = localStorage.getItem(STORE_KEY);
      if(raw){
        var data = JSON.parse(raw);
        state.stages = data.stages || [];
        state.unit = data.unit || 'mph';
      }
    }catch(e){ /* nothing saved yet, or storage unavailable */ }
    applyUnitUI();
    renderAll();
  }

  // ---------- backup: export / import ----------
  function currentBackupPayload(){
    return {
      app: 'incline-routine-backup',
      version: 1,
      exportedAt: new Date().toISOString(),
      unit: state.unit,
      stages: state.stages
    };
  }

  async function exportBackup(){
    if(state.stages.length===0){
      showToast('Add a stage first — nothing to back up yet.');
      return;
    }
    var payload = currentBackupPayload();
    var json = JSON.stringify(payload, null, 2);
    var filename = 'incline-routine-backup.json';
    var file = new File([json], filename, {type:'application/json'});

    // Prefer the native share sheet on iOS (Save to Files, AirDrop, etc.)
    if(navigator.canShare && navigator.canShare({files:[file]})){
      try{
        await navigator.share({files:[file], title:'Incline routine backup'});
        showToast('Backup shared.');
        return;
      }catch(e){
        // user cancelled the share sheet — not an error, just stop here
        if(e && e.name === 'AbortError') return;
      }
    }

    // Fallback: trigger a normal download
    try{
      var blob = new Blob([json], {type:'application/json'});
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
      showToast('Backup downloaded.');
    }catch(e){
      showToast('Could not create backup file.');
    }
  }

  function importBackup(file){
    var reader = new FileReader();
    reader.onload = function(){
      try{
        var data = JSON.parse(reader.result);
        if(!data || !Array.isArray(data.stages)) throw new Error('bad format');
        var valid = data.stages.every(function(s){
          return s && typeof s.incline==='number' && typeof s.speed==='number' && typeof s.minutes==='number';
        });
        if(!valid) throw new Error('bad stage data');
        state.stages = data.stages;
        state.unit = data.unit === 'kph' ? 'kph' : 'mph';
        applyUnitUI();
        save();
        renderAll();
        showToast('Routine restored from backup.');
      }catch(e){
        showToast('That file doesn\'t look like a valid backup.');
      }
    };
    reader.onerror = function(){ showToast('Could not read that file.'); };
    reader.readAsText(file);
  }

  el.exportBtn.addEventListener('click', exportBackup);
  el.importBtn.addEventListener('click', function(){ el.importFile.click(); });
  el.importFile.addEventListener('change', function(){
    var f = el.importFile.files && el.importFile.files[0];
    if(f) importBackup(f);
    el.importFile.value = '';
  });

  // ---------- audio cue (no external asset) ----------
  var actx;
  function beep(freq, dur){
    try{
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      var o = actx.createOscillator();
      var g = actx.createGain();
      o.type = 'sine';
      o.frequency.value = freq;
      g.gain.value = 0.18;
      o.connect(g); g.connect(actx.destination);
      o.start();
      g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
      o.stop(actx.currentTime + dur);
    }catch(e){}
  }
  function cueTransition(){ beep(660, 0.18); setTimeout(function(){beep(880,0.22);}, 140); }
  function cueDone(){ beep(523,0.2); setTimeout(function(){beep(659,0.2);},160); setTimeout(function(){beep(784,0.35);},320); }
  if(navigator.vibrate){ /* best-effort; iOS Safari ignores this */ }

  // ---------- unit ----------
  function applyUnitUI(){
    el.unitMph.classList.toggle('active', state.unit==='mph');
    el.unitKph.classList.toggle('active', state.unit==='kph');
    el.speedUnit.textContent = state.unit;
  }
  el.unitMph.addEventListener('click', function(){ state.unit='mph'; applyUnitUI(); save(); });
  el.unitKph.addEventListener('click', function(){ state.unit='kph'; applyUnitUI(); save(); });

  // ---------- stage CRUD ----------
  function addStage(){
    var incline = parseFloat(el.fIncline.value);
    var speed = parseFloat(el.fSpeed.value);
    var minutes = parseFloat(el.fMinutes.value);
    if(isNaN(incline) || isNaN(speed) || isNaN(minutes) || minutes <= 0){
      flashInvalid();
      return;
    }
    state.stages.push({incline:incline, speed:speed, minutes:minutes});
    el.fIncline.value = ''; el.fSpeed.value=''; el.fMinutes.value='';
    save(); renderAll();
  }
  function flashInvalid(){
    [el.fIncline, el.fSpeed, el.fMinutes].forEach(function(i){
      if(!i.value || isNaN(parseFloat(i.value))){
        i.style.borderColor = 'var(--danger)';
        setTimeout(function(){ i.style.borderColor=''; }, 700);
      }
    });
  }
  function removeStage(idx){
    state.stages.splice(idx,1);
    save(); renderAll();
  }
  function moveStage(idx, dir){
    var j = idx+dir;
    if(j<0 || j>=state.stages.length) return;
    var tmp = state.stages[idx];
    state.stages[idx] = state.stages[j];
    state.stages[j] = tmp;
    save(); renderAll();
  }
  el.addBtn.addEventListener('click', addStage);

  // ---------- render: stage list ----------
  function renderStageList(){
    el.stageCount.textContent = state.stages.length + (state.stages.length===1?' stage':' stages');
    if(state.stages.length===0){
      el.stageList.innerHTML = '<div class="empty">No stages yet — add your first one below.</div>';
      return;
    }
    var html = '';
    state.stages.forEach(function(s, idx){
      html += '<div class="stage-row">'+
        '<div class="stage-idx">'+(idx+1)+'</div>'+
        '<div class="stage-info"><span class="i">'+s.incline+'%</span> · <span class="s">'+s.speed+' '+state.unit+'</span> · <span class="d">'+s.minutes+' min</span></div>'+
        '<div class="stage-actions">'+
          '<button class="icon-btn" data-act="up" data-idx="'+idx+'">↑</button>'+
          '<button class="icon-btn" data-act="down" data-idx="'+idx+'">↓</button>'+
          '<button class="icon-btn remove" data-act="del" data-idx="'+idx+'">✕</button>'+
        '</div></div>';
    });
    el.stageList.innerHTML = html;
    el.stageList.querySelectorAll('.icon-btn').forEach(function(btn){
      btn.addEventListener('click', function(){
        var idx = parseInt(btn.getAttribute('data-idx'),10);
        var act = btn.getAttribute('data-act');
        if(act==='del') removeStage(idx);
        else if(act==='up') moveStage(idx,-1);
        else if(act==='down') moveStage(idx,1);
      });
    });
  }

  // ---------- render: terrain profile ----------
  function renderTerrain(){
    var totalMin = state.stages.reduce(function(a,s){return a+s.minutes;},0);
    el.terrainTotal.textContent = (totalMin>0? round1(totalMin):'0') + ' min total';
    if(state.stages.length===0){
      el.terrain.innerHTML = '';
      return;
    }
    var maxIncline = Math.max.apply(null, state.stages.map(function(s){return s.incline;}).concat([1]));
    var W = 500, H = 64, pad = 4;
    var x = 0;
    var path = 'M0,'+H;
    var segMarkers = [];
    state.stages.forEach(function(s, idx){
      var w = (s.minutes/totalMin) * W;
      var h = pad + (1 - (s.incline/maxIncline)) * (H - pad*2 - 8);
      path += ' L'+round1(x)+','+round1(h)+' L'+round1(x+w)+','+round1(h);
      segMarkers.push({x1:x, x2:x+w, idx:idx});
      x += w;
    });
    path += ' L'+W+','+H+' Z';
    var activeIdx = state.running ? state.currentIdx : -1;
    var rects = segMarkers.map(function(seg){
      var isActive = seg.idx === activeIdx;
      return '<rect x="'+round1(seg.x1)+'" y="0" width="'+round1(seg.x2-seg.x1)+'" height="'+H+'" fill="'+(isActive?'rgba(226,161,61,0.16)':'transparent')+'"></rect>';
    }).join('');
    el.terrain.innerHTML =
      rects +
      '<path d="'+path+'" fill="rgba(226,161,61,0.22)" stroke="#e2a13d" stroke-width="2" stroke-linejoin="round"></path>';
  }
  function round1(n){ return Math.round(n*10)/10; }

  function renderAll(){ renderStageList(); renderTerrain(); }

  // ---------- player ----------
  function fmtClock(totalSec){
    totalSec = Math.max(0, Math.round(totalSec));
    var m = Math.floor(totalSec/60);
    var s = totalSec%60;
    return (m<10?'0':'')+m+':'+(s<10?'0':'')+s;
  }

  function totalRoutineSec(){
    return state.stages.reduce(function(a,s){return a + s.minutes*60;},0);
  }

  function startRoutine(){
    if(state.stages.length===0) return;
    if(state.paused){
      state.paused = false;
      state.running = true;
      tick(); // resume ticking
      el.startBtn.textContent = 'Pause';
      el.startBtn.classList.add('pause');
      state.timer = setInterval(tick, 1000);
      return;
    }
    state.running = true;
    state.paused = false;
    state.currentIdx = 0;
    state.remainingSec = state.stages[0].minutes*60;
    state.totalRemainingSec = totalRoutineSec();
    updatePlayerDisplay();
    el.startBtn.textContent = 'Pause';
    el.startBtn.classList.add('pause');
    renderTerrain();
    clearInterval(state.timer);
    state.timer = setInterval(tick, 1000);
  }

  function pauseRoutine(){
    state.paused = true;
    state.running = false;
    clearInterval(state.timer);
    el.startBtn.textContent = 'Resume';
    el.startBtn.classList.remove('pause');
  }

  function resetRoutine(){
    clearInterval(state.timer);
    state.running = false;
    state.paused = false;
    state.currentIdx = 0;
    state.remainingSec = 0;
    state.totalRemainingSec = 0;
    el.startBtn.textContent = 'Start';
    el.startBtn.classList.remove('pause');
    el.stageName.textContent = 'Ready';
    el.inclineVal.textContent = '–';
    el.speedVal.textContent = '–';
    el.clock.textContent = fmtClock(totalRoutineSec());
    el.clockLabel.textContent = 'total routine time';
    el.nextUp.innerHTML = '&nbsp;';
    renderTerrain();
  }

  function tick(){
    state.remainingSec -= 1;
    state.totalRemainingSec -= 1;
    if(state.remainingSec < 0){
      // advance to next stage
      state.currentIdx += 1;
      if(state.currentIdx >= state.stages.length){
        finishRoutine();
        return;
      }
      state.remainingSec = state.stages[state.currentIdx].minutes*60 - 1;
      cueTransition();
      renderTerrain();
    }
    updatePlayerDisplay();
  }

  function finishRoutine(){
    clearInterval(state.timer);
    state.running = false;
    state.paused = false;
    cueDone();
    el.stageName.textContent = 'Routine complete';
    el.inclineVal.textContent = '–';
    el.speedVal.textContent = '–';
    el.clock.textContent = '00:00';
    el.clockLabel.textContent = 'nice work';
    el.nextUp.innerHTML = '&nbsp;';
    renderTerrain();
    el.startBtn.textContent = 'Start';
    el.startBtn.classList.remove('pause');
  }

  function updatePlayerDisplay(){
    var s = state.stages[state.currentIdx];
    if(!s) return;
    el.stageName.textContent = 'Stage '+(state.currentIdx+1)+' of '+state.stages.length;
    el.inclineVal.textContent = s.incline;
    el.speedVal.textContent = s.speed;
    el.clock.textContent = fmtClock(state.remainingSec);
    el.clockLabel.textContent = 'remaining in this stage';
    var next = state.stages[state.currentIdx+1];
    el.nextUp.innerHTML = next
      ? 'Next: <b>'+next.incline+'% @ '+next.speed+' '+state.unit+'</b> for '+next.minutes+' min'
      : 'Final stage — routine ends after this';
  }

  el.startBtn.addEventListener('click', function(){
    if(state.running) pauseRoutine();
    else startRoutine();
  });
  el.resetBtn.addEventListener('click', resetRoutine);

  load();
})();
</script>
</body>
</html>
